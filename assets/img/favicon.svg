<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Jamieson Lab Handbook — compass favicon/app icon. Gold-rimmed instrument
       face on the site's University Blue -> Dark Pink brand gradient tile.
       Kept as a single hand-authored source; PNG sizes for the web app
       manifest are rasterised from this file (see assets/img/README.md). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#011451"/><stop offset="1" stop-color="#A60367"/>
    </linearGradient>
    <radialGradient id="rim" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#F3E3B8"/><stop offset="55%" stop-color="#D9B36C"/><stop offset="100%" stop-color="#9C7A38"/>
    </radialGradient>
    <radialGradient id="face" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#DCE1EE"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <circle cx="32" cy="32" r="22" fill="url(#rim)"/>
  <circle cx="32" cy="32" r="18" fill="url(#face)"/>
  <g stroke="#8892A8" stroke-width="1">
    <line x1="32" y1="15" x2="32" y2="18.5"/>
    <line x1="32" y1="45.5" x2="32" y2="49"/>
    <line x1="15" y1="32" x2="18.5" y2="32"/>
    <line x1="45.5" y1="32" x2="49" y2="32"/>
  </g>
  <text x="32" y="13.5" text-anchor="middle" font-size="6" font-weight="700" fill="#4A3418" font-family="Arial, sans-serif">N</text>
  <polygon points="32,18 36,32 32,32" fill="#C22B3E"/>
  <polygon points="32,18 28,32 32,32" fill="#A6234E"/>
  <polygon points="32,46 36,32 32,32" fill="#EDEFF5"/>
  <polygon points="32,46 28,32 32,32" fill="#C7CCDA"/>
  <circle cx="32" cy="32" r="2.6" fill="#D9B36C" stroke="#8C6A2F" stroke-width="0.6"/>
</svg>
